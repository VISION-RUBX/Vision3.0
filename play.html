<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Vision</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050505'/%3E%3Cpath d='M17 16h10l5 22 5-22h10L36 48h-8z' fill='%23f6f6f6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./play.js?v=20260511-flag-marker" defer></script>
</head>
<body class="page page-play">
  <canvas id="particleCanvas" class="particle-canvas" aria-hidden="true"></canvas>
  <div class="page-transition" aria-hidden="true"></div>

  <div class="player-shell">
    <header class="player-bar">
      <div class="player-actions">
        <button id="homepageButton" class="back-button" type="button">
          <span aria-hidden="true">&larr;</span>
          <span>Homepage</span>
        </button>
        <button id="fullscreenButton" class="ghost-button" type="button">
          <span id="fullscreenLabel">Fullscreen</span>
        </button>
        <button id="focusModeButton" class="ghost-button" type="button" aria-pressed="false">
          <span data-focus-label>Focus Mode</span>
        </button>
      </div>

      <div class="player-meta">
        <p class="eyebrow">Launcher</p>
        <h1 id="playerTitle">Loading game...</h1>
        <p id="playerMeta" class="panel-copy">Preparing dedicated game tab...</p>
      </div>

      <p id="playerStatus" class="player-status">Starting dedicated player...</p>
    </header>

    <main class="player-main">
      <div id="playerError" class="state-block hidden" role="alert">
        <h2>Game not available</h2>
        <p>Return to the homepage and choose a different game.</p>
      </div>

      <section id="frameWrap" class="frame-wrap hidden" tabindex="-1">
        <iframe
          id="gameFrame"
          title="Game player"
          loading="eager"
          allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </section>
    </main>
  </div>
</body>
</html>
